<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Portfolio Exercise</title>
    <link rel="stylesheet" href="q4g2style.css"> </head>
<body>

    <div class="container">
        <h2>Add a Movie</h2>
        <form id="movieForm">
            <label>Title:</label>
            <input type="text" id="title" required>

            <label>Year:</label>
            <input type="number" id="year" required>

            <label>Genre:</label>
            <select id="genre">
                <option value="Action">Action</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
                <option value="Drama">Musical</option>
                <option value="Drama">Thriller
                <option value="Drama">Horror</option>
                <option value="Drama">Soap</option>
                <option value="Drama">Filipino</option>
                </option>
            </select>

            <label>Rating:</label>
            <div class="star-rating" id="starInput">
                <span class="star" data-value="1">&#9733;</span>
                <span class="star" data-value="2">&#9733;</span>
                <span class="star" data-value="3">&#9733;</span>
                <span class="star" data-value="4">&#9733;</span>
                <span class="star" data-value="5">&#9733;</span>
            </div>

            <button type="submit" id="addBtn">Add Movie</button>
        </form>

        <hr>
        <h2>Movie List</h2>
        <div id="movieDisplay"></div>
    </div>

    <script src="q4g2script.js"></script>
</body>
</html>
